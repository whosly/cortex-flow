[package]
name = "cortex-flow-demo"
version = "0.1.0"
edition = "2021"
description = "CortexFlow 数据分析管道 Demo"

[[bin]]
name = "data-pipeline"
path = "src/main.rs"

[dependencies]
cortex-flow = { path = ".." }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
